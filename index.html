<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشغل يوتيوب VR Box</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Tahoma, sans-serif;
        }

        /* شاشة التحكم العلوية (تختفي عند التشغيل) */
        #control-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(20, 20, 20, 0.9);
            color: #fff;
            padding: 15px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: opacity 0.3s;
        }
        .control-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            font-size: 14px;
        }
        button {
            padding: 8px 16px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #cc0000;
        }
        .sliders-container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            font-size: 12px;
            color: #ccc;
        }
        .slider-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        input[type="range"] {
            width: 100%;
        }

        /* حاوية العرض لـ VR (نصفين يمين ويسار) */
        #vr-container {
            display: none; /* مخفي حتى يتم تحميل الفيديو */
            width: 100%;
            height: 100%;
            position: relative;
        }
        .vr-eye {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #left-eye {
            left: 0;
            border-left: 2px solid #222;
        }
        #right-eye {
            right: 0;
            border-right: 2px solid #222;
        }

        /* إطار الفيديو الداخلي للتعديل والتحكم */
        .video-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: auto;
        }

        /* زر إظهار وإخفاء الإعدادات داخل وضع الـ VR */
        #toggle-menu {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            border: 1px solid #555;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1001;
            display: none;
        }
    </style>
</head>
<body>

    <!-- لوحة التحكم وإدخال الرابط -->
    <div id="control-panel">
        <div class="control-row">
            <input type="text" id="url-input" placeholder="ألصق رابط يوتيوب هنا (مثال: https://youtu.be/...)">
            <button onclick="loadVideo()">تشغيل VR</button>
        </div>
        <div class="sliders-container">
            <div class="slider-group">
                <label>التقريب والابعاد (Zoom): <span id="zoom-val">100%</span></label>
                <input type="range" id="zoom-range" min="80" max="250" value="100" oninput="updateSettings()">
            </div>
            <div class="slider-group">
                <label>المسافة الأفقية (Separation): <span id="sep-val">0px</span></label>
                <input type="range" id="sep-range" min="-100" max="100" value="0" oninput="updateSettings()">
            </div>
        </div>
    </div>

    <!-- شاشة الـ VR المقسومة -->
    <div id="vr-container">
        <div id="left-eye" class="vr-eye">
            <div class="video-wrapper" id="left-wrap">
                <div id="player-left"></div>
            </div>
        </div>
        <div id="right-eye" class="vr-eye">
            <div class="video-wrapper" id="right-wrap">
                <div id="player-right"></div>
            </div>
        </div>
        <button id="toggle-menu" onclick="toggleMenu()">إعدادات / إخفاء</button>
    </div>

    <!-- استدعاء يوتيوب آبي -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let videoId = "";

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function loadVideo() {
            const inputUrl = document.getElementById('url-input').value;
            videoId = extractVideoId(inputUrl);

            if (!videoId) {
                alert("الرابط غير صحيح، تأكد من إدخال رابط يوتيوب صالح.");
                return;
            }

            document.getElementById('control-panel').style.display = 'none';
            document.getElementById('vr-container').style.display = 'block';
            document.getElementById('toggle-menu').style.display = 'block';

            initPlayers();
        }

        function initPlayers() {
            document.getElementById('player-left').innerHTML = '';
            document.getElementById('player-right').innerHTML = '';

            const embedHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&enablejsapi=1&controls=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;

            document.getElementById('player-left').innerHTML = embedHTML;
            document.getElementById('player-right').innerHTML = embedHTML;

            updateSettings();
        }

        function updateSettings() {
            const zoom = document.getElementById('zoom-range').value;
            const sep = document.getElementById('sep-range').value;

            document.getElementById('zoom-val').innerText = zoom + '%';
            document.getElementById('sep-val').innerText = sep + 'px';

            const leftWrap = document.getElementById('left-wrap');
            const rightWrap = document.getElementById('right-wrap');

            leftWrap.style.transform = `scale(${zoom / 100}) translateX(${Number(sep)}px)`;
            rightWrap.style.transform = `scale(${zoom / 100}) translateX(${Number(sep)}px)`;
        }

        function toggleMenu() {
            const panel = document.getElementById('control-panel');
            if (panel.style.display === 'none') {
                panel.style.display = 'flex';
            } else {
                panel.style.display = 'none';
            }
        }
    </script>
</body>
</html>
